services:
  postgres:
    image: postgres:16-alpine
    container_name: alguerisme-postgres-prod
    env_file:
      - .env.prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-alguerisme}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - alguerisme-network

  redis:
    image: redis:7-alpine
    container_name: alguerisme-redis-prod
    secrets:
      - redis_password
    volumes:
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh
      - ./scripts/redis-healthcheck.sh:/usr/local/bin/redis-healthcheck.sh
    command: ["/usr/local/bin/redis-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/redis-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - alguerisme-network

  app:
    build: .
    image: alguerisme-core:prod
    container_name: alguerisme-app-prod
    env_file:
      - .env.prod
    secrets:
      - db_password
      - redis_password
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    # command: To be defined
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alguerisme-network

  celery_worker:
    image: alguerisme-core:prod
    container_name: alguerisme-worker-prod
    env_file:
      - .env.prod
    secrets:
      - db_password
      - redis_password
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    command: ["celery", "-A", "alguerisme.celery.app", "worker", "--loglevel=info"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alguerisme-network

  celery_beat:
    image: alguerisme-core:prod
    container_name: alguerisme-beat-prod
    env_file:
      - .env.prod
    secrets:
      - db_password
      - redis_password
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    command: ["celery", "-A", "alguerisme.celery.app", "beat", "--loglevel=info"]
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alguerisme-network

  nginx:
    image: nginx:alpine
    container_name: alguerisme-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment below when SSL certificates are set up
      # - ./certbot/conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - alguerisme-network

volumes:
  postgres_data_prod:

networks:
  alguerisme-network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/prod/db_password.txt
  redis_password:
    file: ./secrets/prod/redis_password.txt
