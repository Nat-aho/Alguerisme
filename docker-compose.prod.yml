services:
  postgres:
    image: postgres:16-alpine
    container_name: alguerisme-postgres-prod
    env_file:
      - .env.prod
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-alguerisme}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - alguerisme-network

  app:
    build: .
    container_name: alguerisme-app-prod
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    volumes:
      - ./config.yaml:/app/config.yaml:ro  # Read-only config
      - app_logs:/app/logs
    command: ["tail", "-f", "/dev/null"]  # Keep running, use exec to run jobs
    restart: unless-stopped
    networks:
      - alguerisme-network

volumes:
  postgres_data_prod:
  app_logs:

networks:
  alguerisme-network:
    driver: bridge
