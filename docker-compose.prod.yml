services:
  db:
    image: postgres:16-alpine
    container_name: alguerisme-db-prod
    env_file:
      - .env.prod
    secrets:
      - db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-alguerisme}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - alguerisme-network

  redis:
    image: redis:7-alpine
    container_name: alguerisme-redis-prod
    secrets:
      - redis_password
    volumes:
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh
      - ./scripts/redis-healthcheck.sh:/usr/local/bin/redis-healthcheck.sh
    command: ["/usr/local/bin/redis-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/redis-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - alguerisme-network

  minio:
    image: minio/minio:latest
    container_name: alguerisme-minio-prod
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - alguerisme-network

  app:
    build: .
    image: alguerisme-core:prod
    container_name: alguerisme-app-prod
    env_file:
      - .env.prod
    secrets:
      - db_password
      - redis_password
      - telegram_bot_token
      - minio_root_user
      - minio_root_password
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    # command: To be defined
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alguerisme-network

  celery_worker:
    image: alguerisme-core:prod
    container_name: alguerisme-worker-prod
    env_file:
      - .env.prod
    secrets:
      - db_password
      - redis_password
      - telegram_bot_token
      - minio_root_user
      - minio_root_password
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    command: ["celery", "-A", "alguerisme.celery.app", "worker", "--loglevel=info"]
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - alguerisme-network

  celery_beat:
    image: alguerisme-core:prod
    container_name: alguerisme-beat-prod
    env_file:
      - .env.prod
    secrets:
      - db_password
      - redis_password
      - telegram_bot_token
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    command: ["celery", "-A", "alguerisme.celery.app", "beat", "--loglevel=info"]
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alguerisme-network

  nginx:
    image: nginx:alpine
    container_name: alguerisme-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment below when SSL certificates are set up
      # - ./certbot/conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - alguerisme-network

volumes:
  postgres_data_prod:
  minio_data_prod:

networks:
  alguerisme-network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/prod/db_password.txt
  redis_password:
    file: ./secrets/prod/redis_password.txt
  telegram_bot_token:
    file: ./secrets/prod/telegram_bot_token.txt
  minio_root_user:
    file: ./secrets/prod/minio_root_user.txt
  minio_root_password:
    file: ./secrets/prod/minio_root_password.txt
