# Alguerisme Configuration File
# This file contains application settings for the alguerisme crawler
#
# NOTE: Database configuration is handled via environment variables

# HTTP Client Configuration
http_client:
  timeout: 10.0
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  headers: {}
  max_retries: 3
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  retry_start_timeout: 1.0
  max_response_size: 10485760  # 10 MB in bytes

# Web Dictionary Configuration
web_dictionary:
  base_url: "https://www.algueres.net/"
  letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  index_url_template: "{base_url}/index.aspx?lletra={letter}&p={page}"
  entry_link_selector: "a[href*='/vocabols/']"
  entry_link_prefix: "/vocabols/"
  entry_link_suffix: ".aspx"
  content_selector: "#cntBody_pnlNews"

# Crawler Configuration
crawler:
  max_workers: 5
  request_delay: 1.0

# Notification Configuration
notifications:
  telegram:
    chat_id: "-1003451098993"
    enabled: true
    parse_mode: "Markdown"
