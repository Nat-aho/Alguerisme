# Alguerisme Configuration File
# This file contains application settings for the alguerisme crawler
#
# NOTE: Database connection settings (host, port, user, database) 
#       are loaded from environment variables.
#       Redis connection settings (host, port, db)
#       are loaded from environment variables.
#       MinIO connection settings (host, port, secure)
#       are loaded from environment variables.

# Database Configuration
db_config:
  echo: false
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 3600

# Celery Configuration
celery_config:
  timezone: "Europe/Rome"
  enable_utc: true
  task_serializer: "json"
  result_serializer: "json"
  accept_content: ["json"]
  result_expires: 3600

# HTTP Client Configuration
http_client:
  timeout: 10.0
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  headers: {}
  max_retries: 3
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  retry_start_timeout: 1.0
  max_response_size: 1048576  # 1 MB in bytes

# HTTP Client Configuration for Images
http_client_images:
  timeout: 30.0  # Longer timeout for potentially large images
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  headers: {}
  max_retries: 3
  retry_status_codes:
    - 429
    - 500
    - 502
    - 503
    - 504
  retry_start_timeout: 1.0
  max_response_size: 10485760  # 10 MB in bytes (for images)

# Web Dictionary Configuration
web_dictionary:
  base_url: "https://www.algueres.net/"
  letters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  index_url_template: "{base_url}/index.aspx?lletra={letter}&p={page}"
  entry_link_selector: "a[href*='/vocabols/']"
  entry_link_prefix: "/vocabols/"
  entry_link_suffix: ".aspx"
  content_selector: "#cntBody_pnlNews"
  # Parser selectors (moved here so selector rules live with the dictionary config)
  algueres_word_selector: "#cntBody_label_Alg"
  algueres_definition_selector: "#cntBody_txtDefinizione_Alg"
  catalan_word_selector: "#cntBody_label_Cat"
  catalan_definition_selector: "#cntBody_txtDefinizione_Cat"
  italian_word_selector: "#cntBody_label_Ita"
  italian_definition_selector: "#cntBody_txtDefinizione_Ita"
  image_selector: "#cntBody_pnlFoto img[src]"
  audio_embed_selector: "#cntBody_pnlAudio embed"
  audio_tag_selector: "#cntBody_pnlAudio audio[src]"

# Crawler Configuration
crawler:
  max_workers: 5
  request_delay: 1.0
  queue_timeout: 60.0  # Timeout in seconds waiting for next item in queue

# Collector Configuration
collector:
  max_workers: 5
  request_delay: 1.0

# Parser Configuration
parser:
  # Runtime parser settings (selectors are part of `web_dictionary` above)
  parsing_version: "1.0"
  max_workers: 10

# MinIO Configuration
minio_config:
  bucket_name: "alguerisme-images"
  region: "us-east-1"

# Notification Configuration
notifications:
  telegram:
    chat_id: "-1003451098993"
    enabled: true
    parse_mode: "Markdown"
