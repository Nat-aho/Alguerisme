[project]
name = "alguerisme"
version = "0.1.0"
description = "Lexical tools and digital resources for the Alguerés language"
readme = "README.md"
authors = [
    { name = "Nat-aho", email = "natascia.caria@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "sqlmodel>=0.0.31",
    "psycopg2-binary>=2.9.10",
    "pyyaml>=6.0.3",
    "alembic>=1.18.1",
    "python-dotenv>=1.2.1",
]

[project.scripts]
alguerisme = "alguerisme.clis:main"
alguerisme-crawler = "alguerisme.clis.crawler_cli:main"

[project.optional-dependencies]
cli = [
    "rich>=14.3.1",
    "typer>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pylint>=4.0.4",
    "ruff>=0.14.13",
]

[tool.ruff.lint]
# Enable errors, warnings, pyflakes, docstrings
select = ["E", "W", "F", "D"]
ignore = []
extend-ignore = [
    "D203",  # blank line before class
    "D213",  # multi-line summary second line
]

[tool.ruff.per-file-ignores]
"**/__init__.py" = ["D"]

[tool.pylint.docstring]
docstring-min-length = 1
docstring-style = "numpy"
docstring-max-line-length = 72

[tool.pylint.master]
per-file-ignores = "__init__.py:C0114"
