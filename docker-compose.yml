services:
  db:
    image: postgres:16-alpine
    container_name: alguerisme-db-dev
    env_file:
      - .env.dev
    secrets:
      - db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-alguerisme}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alguerisme-network

  redis:
    image: redis:7-alpine
    container_name: alguerisme-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    secrets:
      - redis_password
    volumes:
      - ./scripts/redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh
      - ./scripts/redis-healthcheck.sh:/usr/local/bin/redis-healthcheck.sh

    command: ["/usr/local/bin/redis-entrypoint.sh"]
    
    healthcheck:
      test: ["CMD", "/usr/local/bin/redis-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alguerisme-network

  minio:
    image: minio/minio:latest
    container_name: alguerisme-minio-dev
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    secrets:
      - minio_root_user
      - minio_root_password
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio_data_dev:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alguerisme-network

  app:
    image: alguerisme-core:dev
    build: .
    container_name: alguerisme-app-dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.dev
    secrets:
      - db_password
      - redis_password
      - telegram_bot_token
      - minio_root_user
      - minio_root_password
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml
      - ./src:/app/src
      - ./alembic:/app/alembic
    command: ["tail", "-f", "/dev/null"]
    stdin_open: true
    tty: true
    networks:
      - alguerisme-network

  celery_worker:
    image: alguerisme-core:dev
    container_name: alguerisme-worker-dev
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env.dev
    secrets:
      - db_password
      - redis_password
      - telegram_bot_token
      - minio_root_user
      - minio_root_password
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml
      - ./src:/app/src  # Mount source so worker updates with code changes
    # Run the worker
    command: ["celery", "-A", "alguerisme.celery.app", "worker", "--loglevel=info"]
    networks:
      - alguerisme-network

  celery_beat:
    image: alguerisme-core:dev
    container_name: alguerisme-beat-dev
    restart: on-failure
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.dev
    secrets:
      - db_password
      - redis_password
      - telegram_bot_token
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml
      - ./src:/app/src
    # Run the beat scheduler
    command: ["celery", "-A", "alguerisme.celery.app", "beat", "--loglevel=info"]
    networks:
      - alguerisme-network

volumes:
  postgres_data_dev:
  minio_data_dev:

networks:
  alguerisme-network:
    driver: bridge

secrets:
  db_password:
    file: ./secrets/dev/db_password.txt
  redis_password:
    file: ./secrets/dev/redis_password.txt
  telegram_bot_token:
    file: ./secrets/dev/telegram_bot_token.txt
  minio_root_user:
    file: ./secrets/dev/minio_root_user.txt
  minio_root_password:
    file: ./secrets/dev/minio_root_password.txt
